<title>HeartKidz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* VOICE everyday, tender: a calm bedtime ritual for kids, a clear pattern desk for parents
   IDEA the inner weather report: sun, still air, rain, thunder; each day becomes one coloured heart
   PICTURE night-sky band with two hearts; per child a strip of weather-hearts; parent: mood line + weekday grid
   COLOUR warm paper, deep indigo night band, rose heart; weather zones yellow/green/blue/red; kids violet + teal
   TYPE Baloo 2 for titles, Nunito for text
   LAYOUT one column app up to 980px; parent panels two columns above 760px, stacked on phones */
:root{color-scheme:light dark;
--bg:light-dark(#fffaf5,#17131f);--paper:light-dark(#ffffff,#221c2d);--soft:light-dark(#f6efe9,#2b2438);
--ink:light-dark(#2b2238,#f4eefa);--muted:light-dark(#6d6479,#b6acc3);--line:light-dark(#ece2da,#3a3147);
--heart:light-dark(#e2475b,#ff6b7d);--night:light-dark(#2e2a6e,#100d22);
--c1:light-dark(#7a4fc9,#9576e0);--c2:light-dark(#00948c,#1fa5a8);
--zY:light-dark(#d99a00,#c8941a);--zG:light-dark(#2f9e6a,#36a872);--zB:light-dark(#3b78d0,#4f86dc);--zR:light-dark(#d9473f,#e05c52);--zN:light-dark(#a39bae,#7d7589);--zO:light-dark(#e8822a,#f0954a);--zL:light-dark(#8fbcef,#6f9fd8)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,ui-rounded,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Baloo 2",Nunito,sans-serif;line-height:1.08;letter-spacing:-.01em;margin:0;text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
.app{max-width:980px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 120px max(16px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 0 10px}
.brand{display:flex;align-items:center;gap:8px;font:800 1.35rem "Baloo 2",sans-serif}
.brand img{width:46px;height:auto;display:block}.brand .kz i{font-style:normal}.brand span{color:var(--ink)}
body.onhome .brand{visibility:hidden}
.logo{display:block;width:min(380px,88%);height:auto;margin:-4px auto 12px}
.logo-d{display:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .logo-l{display:none}:root:not([data-theme=light]) .logo-d{display:block}}
:root[data-theme=dark] .logo-l{display:none}:root[data-theme=dark] .logo-d{display:block}
.today{color:var(--muted);font-size:.9rem;font-weight:700}
.screen{display:none}.screen.on{display:block}
.sky{background:var(--night);color:#fff;border-radius:28px;position:relative;overflow:hidden;padding:28px 24px 30px;min-height:210px;display:grid;align-content:end}
.sky svg.scene{position:absolute;inset:0;width:100%;height:100%}
.sky h1{font-size:clamp(2rem,7vw,3.1rem);position:relative;max-width:12ch}
.sky p{position:relative;margin:8px 0 0;max-width:34ch;color:#e6e2ff}
.h2{font-size:1.45rem;margin:26px 0 12px}
.kids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kid{border:0;text-align:left;background:var(--paper);border-radius:24px;padding:18px;box-shadow:0 1px 0 var(--line),0 10px 28px color-mix(in oklab,var(--ink) 8%,transparent);display:grid;gap:10px}
.kid .av{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;font-size:34px;background:color-mix(in oklab,var(--kc) 16%,var(--paper))}
.kid strong{font:800 1.5rem "Baloo 2",sans-serif}
.kid .st{color:var(--muted);font-size:.92rem;font-weight:700}
.kid .st b{color:var(--kc)}
.strip{display:flex;gap:3px}.strip svg{width:100%;max-width:26px;aspect-ratio:1}

function lineChart(fig,series,from,to,evs=[]){
  const s=fig.querySelector('svg'),tip=fig.querySelector('.tip');

  const idx=Object.fromEntries(days.map((d,i)=>[d,i]));

    let g=`<rect x="${L}" y="${T}" width="${iw}" height="${ih/2}" fill="var(--zG)" opacity=".07"/><rect x="${L}" y="${y(0)}" width="${iw}" height="${ih/2}" fill="var(--zB)" opacity=".07"/>`;

      const em=CT[e.cat]?CT[e.cat].e:'📌',lab=w>110&&W>=520?em+' '+(e.title.length>16?e.title.slice(0,15)+'…':e.title):em;g+=`<text x="${(x1+3).toFixed(1)}" y="${T+15}" class="ax" style="font-size:12px">${esc(lab)}</text>`});
    const nt=W<520?3:6,st=Math.max(1,Math.ceil((days.length-1)/(nt-1)));

    const ends=[];
    series.forEach(se=>{

      if(days.length<=100)g+=pts.map(p=>`<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.s).toFixed(1)}" r="4" fill="${se.col}" stroke="var(--paper)" stroke-width="2"/>`).join('');
      const lp=pts[pts.length-1];ends.push({y:y(lp.s),n:se.name,c:se.col});
    });
    if(multi&&W>=520){ends.sort((a,b)=>a.y-b.y);for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<16)ends[i].y=ends[i-1].y+16;ends.forEach(e=>g+=`<text x="${L+iw+8}" y="${e.y+4}" class="ax" style="fill:${e.c}">${esc(e.n)}</text>`)}
    if(!series.some(se=>se.recs.some(r=>score(r)!==null)))g+=`<text x="${L+iw/2}" y="${T+ih/2-10}" text-anchor="middle" class="ax">Nog geen dagen in deze periode</text>`;
    g+=`<line class="hx" x1="0" x2="0" y1="${T}" y2="${T+ih}" stroke="var(--muted)" opacity="0"/><rect x="${L}" y="0" width="${iw}" height="${H}" fill="transparent"/>`;
    s.innerHTML=g;
    const hx=s.querySelector('.hx');
    s.onpointermove=e=>{const r=s.getBoundingClientRect();let i=Math.round((e.clientX-r.left-L)/(days.length<2?1:iw/(days.length-1)));i=Math.max(0,Math.min(days.length-1,i));const d=days[i];
      hx.setAttribute('x1',x(i));hx.setAttribute('x2',x(i));hx.setAttribute('opacity','.5');
      tip.innerHTML=`<b>${esc(cap(long(d)))}</b>`+series.map(se=>{const rc=se.recs.find(q=>q.date===d);const m=rc&&EM[rc.main||(rc.emotions||[])[0]];return`<div>${esc(se.name)}: ${rc?(m?m.e+' '+esc(m.l)+' · '+fmt(score(rc)):'geen gevoel gekozen'):'niet ingevuld'}</div>`}).join('');

    s.onpointerleave=()=>{tip.style.display='none';hx.setAttribute('opacity','0')};
  };
  obs(fig,draw);
}

async function wxFetch(force){const L=S.settings.loc;if(!L||DEMO||wxBusy)return;if(!force&&S.wxAt&&Date.now()-S.wxAt<6*3600e3)return;wxBusy=true;

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f)f(b)});

document.addEventListener('change',e=>{if(e.target.id==='ngD'&&e.target.value){ngDate=e.target.value>todayKey()?todayKey():e.target.value;renderParent()}if(e.target.id==='rTxt'){window._rTxt=e.target.checked;renderParent()}if(e.target.id==='rPar'){window._rPar=e.target.checked;renderParent()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pinIn')A.unlock();if(e.key==='Enter'&&e.target.id==='mInput')closeModal(true);if(e.key==='Escape'&&modalRes)closeModal(false)});
$('#importFile').addEventListener('change',async ev=>{const files=[...ev.target.files];ev.target.value='';if(!files.length)return;
  const read=f=>new Promise(res=>{const rd=new FileReader();rd.onload=()=>{try{res(convert(JSON.parse(rd.result)))}catch(e){res(null)}};rd.onerror=()=>res(null);rd.readAsText(f)});
  const ns=(await Promise.all(files.map(read)));const ok2=ns.filter(Boolean);
  if(!ok2.length){toast('Dit is geen geldige HeartKidz- of Daglicht-back-up');return}
  const tot=f=>ok2.reduce((a,n)=>a+Object.keys(n[f]||{}).length,0);
  const r=await modal({title:'Back-up toevoegen',body:`${ok2.length>1?ok2.length+' back-ups met samen ':'Deze back-up bevat '}${tot('cks')} check-outs, ${tot('nights')} nachten, ${tot('moments')} gevoelsmomenten en ${tot('events')} gebeurtenissen.${ns.length>ok2.length?' '+(ns.length-ok2.length)+' bestand(en) konden niet gelezen worden.':''}<br><br><b>Samenvoegen</b> voegt alles toe aan wat er op dit apparaat staat. Staat dezelfde dag op beide apparaten, dan blijft de nieuwste versie bewaard en worden lege velden aangevuld.`,ok:'Samenvoegen',cancel:'Annuleren',alt:'Alles vervangen'});
  if(!r.ok)return;if(DEMO)stopDemo();
  if(r.ok==='alt'){const r2=await modal({title:'Echt alles vervangen?',body:'Alle huidige gegevens op dit apparaat worden overschreven door de back-up.',ok:'Vervangen',cancel:'Annuleren',danger:true});if(!r2.ok)return;replaceAll(ok2[0]);ok2.slice(1).forEach(mergeAll);toast('Back-up teruggezet');go('parent');return}
  const st={add:0,upd:0,del:0,skip:0};ok2.forEach(n=>{const x=mergeAll(n);Object.keys(st).forEach(k=>st[k]+=x[k])});
  go('parent');modal({title:'Samengevoegd',body:`${st.add} nieuw toegevoegd · ${st.upd} aangevuld of bijgewerkt${st.del?' · '+st.del+' verwijderd (ook op het andere apparaat verwijderd)':''}${st.skip?' · '+st.skip+' overgeslagen (hier eerder verwijderd)':''}.`,ok:'Top'});
});

/* ---------- boot ---------- */
function start(h){
  scene();renderHome();
  if(h&&h.draft&&h.screen==='flow'&&prof(h.draft.childId)){draft=h.draft;buildFS();step=Math.min(h.step||0,FS.length-1);go('flow');renderStep()}
  if(window.claude&&window.claude.use){
    window.claude.use('downloads').then(x=>{dl=x}).catch(()=>{});
    window.claude.use('tts').then(x=>{tts=x;if(screen==='flow')renderStep();if(screen==='help'&&H&&H.st!=='do')renderHelp()}).catch(()=>{});
    window.claude.use('dictation').then(x=>{if(!x)return;dict=x;
      x.onFinal(({text})=>{const el=micTarget&&document.getElementById(micTarget);if(!el||!text)return;el.value=(el.value?el.value.replace(/\s*$/,' '):'')+text;if(draft&&el.dataset.f)draft[el.dataset.f]=el.value;if(H&&el.dataset.hf)H[el.dataset.hf]=el.value});
      x.onState(({state})=>{document.querySelectorAll('[data-act=mic]').forEach(b=>{const on=state==='listening'&&b.dataset.target===micTarget;b.classList.toggle('live',on);b.querySelector('span').textContent=on?'Stop':'Inspreken'})});
      if(screen==='flow')renderStep()}).catch(()=>{});
  }
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({screen,draft,step}));
}
try{if((location.protocol==='https:'||location.hostname==='localhost')&&window.top===window&&!window.claude){const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
}
